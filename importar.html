<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Importação de Conferência - FreteOnX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Incluindo a biblioteca PapaParse para ler CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        window.supabaseClient = createClient('https://fqrfknyludtvqaaajjoc.supabase.co', 'sb_publishable_fkC9WhreuFmhmbVRCw6Isw_rftuBACx');
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-lg border border-slate-700">
        <h2 class="text-2xl font-bold mb-2 text-white">Importar Dados</h2>
        <p class="text-slate-400 text-sm mb-6">Selecione um arquivo CSV com as colunas: <code class="bg-slate-900 px-1 rounded">VOLUME_CLIE, NR, NF</code></p>

        <div class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center hover:border-amber-500 transition-colors">
            <input type="file" id="csvFile" accept=".csv" class="hidden">
            <label for="csvFile" class="cursor-pointer">
                <span class="block text-amber-400 font-bold mb-2">Clique para selecionar CSV</span>
                <span id="fileName" class="text-xs text-slate-500">Nenhum arquivo escolhido</span>
            </label>
        </div>

        <button id="btnImportar" class="w-full mt-6 py-3 bg-amber-600 hover:bg-amber-700 font-bold rounded-xl transition-all disabled:opacity-50">
            Iniciar Importação
        </button>
        
        <div id="status" class="mt-4 text-center text-sm font-semibold"></div>
    </div>

    <script>
        document.getElementById('csvFile').addEventListener('change', (e) => {
            document.getElementById('fileName').textContent = e.target.files[0]?.name || 'Nenhum arquivo';
        });

        document.getElementById('btnImportar').addEventListener('click', () => {
            const file = document.getElementById('csvFile').files[0];
            if (!file) return alert('Selecione um arquivo!');
            
            const status = document.getElementById('status');
            status.textContent = "Processando...";

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async (results) => {
                    // Mapeia os dados conforme o nome das colunas no seu Supabase
                    const data = results.data.map(row => ({
                        VOLUME_CLIE: row.VOLUME_CLIE,
                        NR: row.NR,
                        NF: row.NF
                    }));

                    try {
                        const { error } = await window.supabaseClient.from('conferencia').upsert(data);
                        if (error) throw error;
                        status.textContent = "✅ Importação concluída com sucesso!";
                        status.className = "mt-4 text-center text-green-400";
                    } catch (err) {
                        status.textContent = "❌ Erro ao importar: " + err.message;
                        status.className = "mt-4 text-center text-red-400";
                    }
                }
            });
        });
    </script>
</body>
</html>
